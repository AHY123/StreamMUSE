project: &project "Discriminative Reward Model for RL Finetuning"
description: |
  "Discriminative reward model for local quality assessment in melody-accompaniment generation.
  Uses single RoFormer encoder to classify melody-accompaniment combinations as real or fake."

name: &name "discriminative_reward"
version: &version "1.0"
save_dir: &save_dir "logs/"

loggers:
  csv_logger:
    type: "csv"
  tensorboard_logger:
    type: "tensorboard"

dataset:
  tokenizer: "XinYue's"
  train_config:
    batch_size: 8
    num_workers: 4
    file_path: "data/reward_training_acc.pt"
    target_length: 256
    tokenization_type: "XinYue's"
    split_ratio: 10
    sequence_shift: 32
  val_config:
    batch_size: 8
    num_workers: 4
    file_path: "data/reward_training_acc.pt"
    target_length: 256
    tokenization_type: "XinYue's"
    split_ratio: 10
    sequence_shift: 32

model:
  model_name: "Discriminative-Reward-Model"
  model_type: "Discriminative-Reward-Model"
  
  # Architecture parameters
  hidden_size: 512
  num_layers: 6
  num_attention_heads: 6
  intermediate_size: 2048
  
  # Classification parameters
  pooling_strategy: "cls"
  num_classes: 2
  
  # Dropout parameters
  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1

trainer:
  max_epochs: 50
  accelerator: "gpu"
  devices: [0]
  precision: "bf16-mixed"

seed: 42