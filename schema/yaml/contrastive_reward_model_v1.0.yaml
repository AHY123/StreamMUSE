project: &project "Contrastive Reward Model for RL Finetuning"
description: |
  "Contrastive reward model for global harmony assessment in melody-accompaniment generation.
  Uses dual RoFormer encoders to learn which melody and accompaniment combinations belong together."

name: &name "contrastive_reward"
version: &version "1.0"
save_dir: &save_dir "logs/"

loggers:
  csv_logger:
    type: "csv"
  tensorboard_logger:
    type: "tensorboard"

dataset:
  tokenizer: "XinYue's"
  train_config:
    batch_size: 8
    num_workers: 4
    file_path: "data/reward_training_acc.pt"
    target_length: 256
    tokenization_type: "XinYue's"
    split_ratio: 10
    sequence_shift: 32
  val_config:
    batch_size: 8
    num_workers: 4
    file_path: "data/reward_training_acc.pt"
    target_length: 256
    tokenization_type: "XinYue's"
    split_ratio: 10
    sequence_shift: 32

model:
  model_name: "Contrastive-Reward-Model"
  model_type: "Contrastive-Reward-Model"
  
  # Architecture parameters
  hidden_size: 512
  num_layers: 6
  num_attention_heads: 6
  intermediate_size: 2048
  
  # Contrastive learning parameters
  temperature: 0.07
  embedding_dim: 512
  
  # Dropout parameters
  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1

trainer:
  max_epochs: 50
  accelerator: "gpu"
  devices: [0]
  precision: "bf16-mixed"

seed: 42