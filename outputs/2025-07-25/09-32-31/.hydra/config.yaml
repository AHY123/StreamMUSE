model:
  _target_: src.model.old_m2a_roformer.model.OldM2ATransformer
  sub_seq_len: 384
  local_encoder_network_config:
    _target_: transformers.models.roformer.configuration_roformer.RoFormerConfig
    vocab_size: 50000
    embedding_size: null
    hidden_size: 768
    hidden_act: gelu
    hidden_dropout_prob: 0.1
